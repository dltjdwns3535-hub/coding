name: Verify

on:
  pull_request:

permissions:
  contents: read

concurrency:
  group: verify-${{ github.event.pull_request.number }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Unit, build, and browser tests
    runs-on: ubuntu-24.04
    timeout-minutes: 20

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Use Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22.x
          cache: npm

      - name: Install dependencies from lock file
        run: npm ci

      - name: Run unit tests
        run: npm test

      - name: Run type checks
        run: npm run typecheck

      - name: Build static site
        run: npm run build

      - name: Package verified-mode static ZIP
        run: npm run package:static

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Test exported site in Chromium
        run: npm run test:e2e

      - name: Audit dependencies for high-severity vulnerabilities
        if: ${{ !cancelled() }}
        run: npm audit --audit-level=high --json > npm-audit.json

      - name: Upload dependency security report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: npm-audit-report
          path: npm-audit.json
          if-no-files-found: error
          retention-days: 3

      - name: Upload browser report, traces, and screenshots
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: playwright-results
          path: |
            playwright-report/
            test-results/
            screenshots/
          if-no-files-found: warn
          retention-days: 3

      - name: Upload static export
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: static-export
          path: out/
          if-no-files-found: warn
          retention-days: 3

      - name: Upload static ZIP
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: static-export-zip
          path: artifacts/*.zip
          if-no-files-found: warn
          retention-days: 3
